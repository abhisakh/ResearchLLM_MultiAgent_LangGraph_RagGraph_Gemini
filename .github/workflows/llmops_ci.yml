name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic tests. No API keys, no network, no torch.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m pytest -v

  # Always builds the image so a broken Dockerfile fails the PR.
  # Only pushes to Docker Hub for pushes to the default branch.
  docker:
    name: Docker image
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build image (no push)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/research-agent:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/research-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
