name: LLMOps CI/CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  research-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # FIX 1: Set up Docker Buildx (Required for advanced registry layer caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Headless AI Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          GPT_5_API_KEY: ${{ secrets.GPT_5_API_KEY }}
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
          ENTREZ_EMAIL: "researcher@example.com"
        run: python -m pytest -s -W ignore tests/test_ai_rigor.py | tee research_audit.log

      - name: Upload AI Research Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reasoning-trace-${{ github.run_id }}
          path: research_audit.log
          retention-days: 7

      - name: Log in to Docker Hub
        id: docker_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Fallback block: If the network drops the first attempt, wait and retry
      - name: Wait before retry
        if: steps.docker_login.outcome == 'failure'
        run: sleep 5

      - name: Retry Login to Docker Hub on Network Failure
        if: steps.docker_login.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # FIX 2: Added advanced GitHub Actions cache configuration
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/research-agent:latest
          cache-from: type=gha                  # Look for cached container layers in GitHub Actions
          cache-to: type=gha,mode=max           # Export all compiled layers (including requirements) back to cache
