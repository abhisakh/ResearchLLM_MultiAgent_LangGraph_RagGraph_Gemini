services:
  # The Research Agent Engine (FastAPI)
  backend:
    build: .
    image: research-agent:local
    container_name: research_backend_local
    environment:
      # PYTHONPATH lets backend.py resolve the 'backend.*' package imports
      - PYTHONPATH=/app:/app/backend
      # Chat history lives in a named volume, so a fresh clone needs no pre-existing files
      - CHAT_DB_PATH=/app/data/chat_history.db
    command: uvicorn backend.backend:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # The Research Agent UI (Streamlit). Reuses the image built for the backend.
  frontend:
    image: research-agent:local
    container_name: research_frontend_local
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Internal Docker networking to reach the backend service
      - API_BASE_URL=http://backend:8000
    command: streamlit run frontend/ui_main.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env

volumes:
  chat_data:
